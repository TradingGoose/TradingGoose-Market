name: Release TradingGoose Market

on:
  workflow_dispatch:

concurrency:
  group: tradinggoose-market-release
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: market_quality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market -d market_quality"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run db:build
      - run: bun run type-check
      - run: bun run lint
      - name: Start and verify transaction pooling
        env:
          PGPASSWORD: market
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y pgbouncer
          cd "$RUNNER_TEMP"
          umask 077
          echo '"market" "market"' > pool-users.txt
          cat > quality-pool.ini <<EOF
          [databases]
          * = host=127.0.0.1 port=5432
          [pgbouncer]
          listen_addr = 127.0.0.1
          listen_port = 26432
          unix_socket_dir = $RUNNER_TEMP
          auth_file = $RUNNER_TEMP/pool-users.txt
          auth_type = scram-sha-256
          admin_users = market
          pool_mode = transaction
          default_pool_size = 5
          server_round_robin = 1
          server_reset_query = DISCARD ALL
          server_reset_query_always = 1
          max_prepared_statements = 0
          logfile = $RUNNER_TEMP/quality-pool.log
          pidfile = $RUNNER_TEMP/quality-pool.pid
          EOF
          pgbouncer -d quality-pool.ini
          export PGHOST=127.0.0.1 PGPORT=26432 PGUSER=market
          deadline=$((SECONDS + 30))
          until config=$(timeout 2s psql -XAtw -v ON_ERROR_STOP=1 -d pgbouncer -c 'show config'); do
            if (( SECONDS >= deadline )); then
              cat "$RUNNER_TEMP/quality-pool.log" >&2
              exit 1
            fi
            sleep 1
          done
          grep -q '^pool_mode|transaction|' <<< "$config" || { echo "PgBouncer must use transaction pooling" >&2; exit 1; }
          export PGDATABASE=market_quality
          for i in {1..5}; do psql -XAt -c 'select pg_sleep(0.2)' & done
          wait
          # One client executes successive transactions on the warmed backends.
          pids=$(for i in {1..8}; do echo 'select pg_backend_pid();'; done | psql -XAt -v ON_ERROR_STOP=1)
          test "$(sort -u <<< "$pids" | wc -l)" -ge 2
      - run: bun run test
        env:
          DATABASE_URL: postgres://market:market@127.0.0.1:26432/market_quality

  release-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: market_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market -d market_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run db:build
      - run: bun run db:migrate
        env:
          DATABASE_URL: postgres://market:market@127.0.0.1:5432/market_release
      - run: bun run test:release
        env:
          DATABASE_URL: postgres://market:market@127.0.0.1:5432/market_release
          NEXT_PUBLIC_APP_URL: https://market.example.test:3000
          BETTER_AUTH_URL: https://market.example.test:3000
          BETTER_AUTH_SECRET: 51d365045e0022c3c710f22e1d4133321ae9eb5e081d6eee119c09cacf145dfb
          PAYG_USD_PER_1000_READS: "1.00"
          UNKEY_API_ID: api_release_validation
          UNKEY_ROOT_KEY: unkey_release_root
          RESEND_API_KEY: re_release_validation

  release:
    needs: [quality, release-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Create TradingGoose Market release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +'%Y.%m.%d')"
          SUFFIX=0
          while gh release view "$TAG" > /dev/null 2>&1; do
            SUFFIX=$((SUFFIX + 1))
            TAG="v$(date -u +'%Y.%m.%d').$SUFFIX"
          done

          gh release create "$TAG" \
            --title "TradingGoose Market $TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --latest
