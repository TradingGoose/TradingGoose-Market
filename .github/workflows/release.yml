name: Release TradingGoose Market

on:
  workflow_dispatch:

concurrency:
  group: tradinggoose-market-release
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: market_quality
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market -d market_quality"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run db:build
      - run: bun run type-check
      - run: bun run lint
      - run: bun run test
        env:
          DATABASE_URL: postgres://market:market@127.0.0.1:5432/market_quality

  release-validation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: market
          POSTGRES_PASSWORD: market
          POSTGRES_DB: market_release
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U market -d market_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run db:build
      - run: bun run db:migrate
        env:
          DATABASE_URL: postgres://market:market@127.0.0.1:5432/market_release
      - run: bun run test:release
        env:
          DATABASE_URL: postgres://market:market@127.0.0.1:5432/market_release
          NEXT_PUBLIC_APP_URL: https://127.0.0.1:3000
          BETTER_AUTH_URL: https://127.0.0.1:3000
          BETTER_AUTH_SECRET: 51d365045e0022c3c710f22e1d4133321ae9eb5e081d6eee119c09cacf145dfb
          PAYG_USD_PER_1000_READS: "1.00"
          UNKEY_API_ID: api_release_validation
          UNKEY_KEY_MANAGEMENT_ROOT_KEY: unkey_release_management
          UNKEY_KEY_VERIFY_ROOT_KEY: unkey_release_verify
          RESEND_API_KEY: re_release_validation
          RESEND_FROM_EMAIL: "TradingGoose Market <market@example.com>"

  release:
    needs: [quality, release-validation]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Create TradingGoose Market release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date -u +'%Y.%m.%d')"
          SUFFIX=0
          while gh release view "$TAG" > /dev/null 2>&1; do
            SUFFIX=$((SUFFIX + 1))
            TAG="v$(date -u +'%Y.%m.%d').$SUFFIX"
          done

          gh release create "$TAG" \
            --title "TradingGoose Market $TAG" \
            --target "$GITHUB_SHA" \
            --generate-notes \
            --latest
